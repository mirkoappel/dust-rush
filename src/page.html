<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142d35"><meta name="description" content="Dein Monstertruck. Riesige Reifen, Sprünge und jede Menge Wumms. Einfach losfahren!">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DUST RUSH — Monstertruck-Rennen</title>
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body data-mode="loading" data-course="race">
<!-- ICON_LIBRARY -->
<canvas id="game" aria-label="3D-Monstertruck-Rennstrecke"></canvas>
<div class="vignette" aria-hidden="true"></div>
<header class="masthead"><button id="home" class="icon-button home-button" aria-label="Zum Hauptmenü" hidden><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-home"/></svg></button><button class="icon-button" id="settings" aria-label="Einstellungen"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-settings"/></svg></button></header>
<main>
<section id="garage" class="garage">
  <h1>DUST<br><em>RUSH.</em></h1>
  <div class="course-picker" role="group" aria-label="Spielart">
    <button id="raceMode" data-course="race" aria-label="Rennen – Strecke mit Zielflagge" aria-pressed="true"><svg class="mode-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-flag"/></svg><span>Rennen</span><i class="selected-mark" aria-hidden="true">✓</i></button>
    <button id="arenaMode" data-course="arena" aria-label="Rambazamba – frei in der Sprungarena fahren" aria-pressed="false"><svg class="mode-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-jump"/></svg><span>Rambazamba</span><i class="selected-mark" aria-hidden="true">✓</i></button>
    <button id="workshopMode" data-course="workshop" aria-label="Werkstatt – deinen Monstertruck umbauen" aria-pressed="false"><svg class="mode-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-garage"/></svg><span>Werkstatt</span><i class="selected-mark" aria-hidden="true">✓</i></button>
  </div>
  <section id="workshopPanel" class="workshop-panel" aria-label="Werkstatt" hidden>
    <div class="workshop-tabs" role="group" aria-label="Werkstatt-Bereich">
      <button data-workshop-tab="body" aria-label="Karosserieform" aria-pressed="true"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-body"/></svg></button>
      <button data-workshop-tab="wheels" aria-label="Reifen" aria-pressed="false"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-wheel"/></svg></button>
      <button data-workshop-tab="lift" aria-label="Fahrwerkshöhe" aria-pressed="false"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-spring"/></svg></button>
      <button data-workshop-tab="engine" aria-label="Motor" aria-pressed="false"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-engine"/></svg></button>
      <button data-workshop-tab="parts" aria-label="Anbauteile" aria-pressed="false"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-wrench"/></svg></button>
    </div>
    <div data-workshop-panel="body">
      <div class="part-options" role="group" aria-label="Karosserieformen">
        <button data-build="body" data-preview="Body_pickup" data-value="pickup" aria-label="Pickup-Karosserie" aria-pressed="true"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-pickup"/></svg><span class="sr-only">Pickup</span></button>
        <button data-build="body" data-preview="Body_buggy" data-value="buggy" aria-label="Buggy-Karosserie" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-buggy"/></svg><span class="sr-only">Buggy</span></button>
        <button data-build="body" data-preview="Body_van" data-value="van" aria-label="Van-Karosserie" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-van"/></svg><span class="sr-only">Van</span></button>
        <button data-build="body" data-preview="Body_hotrod" data-value="hotrod" aria-label="Hotrod-Karosserie" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-hotrod"/></svg><span class="sr-only">Hotrod</span></button>
      </div>
    </div>
    <div data-workshop-panel="wheels" hidden>
      <div class="part-options" role="group" aria-label="Reifenvarianten">
        <button data-build="wheels" data-preview="Wheel_standard" data-value="standard" aria-label="Geländereifen" aria-pressed="true"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-wheel"/></svg></button>
        <button data-build="wheels" data-preview="Wheel_giant" data-value="giant" aria-label="Riesenreifen" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-wheel"/></svg></button>
        <button data-build="wheels" data-preview="Wheel_sand" data-value="sand" aria-label="Breite Sandreifen" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-wheel"/></svg></button>
        <button data-build="wheels" data-preview="Wheel_street" data-value="street" aria-label="All-Terrain-Reifen" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-wheel"/></svg></button>
      </div>
    </div>
    <div data-workshop-panel="lift" hidden>
      <div class="part-options" role="group" aria-label="Fahrwerkshöhe">
        <button data-build="lift" data-value="normal" aria-label="Normales Fahrwerk" aria-pressed="true"><svg class="part-art" viewBox="0 0 90 90" aria-hidden="true"><g transform="translate(0 24) scale(1 0.5)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M45 14v61" stroke="#8aa5a7" stroke-width="10"/><path d="M32 22h26L32 31l26 9-26 9 26 9-26 9h26" stroke="#ff9b51" stroke-width="6"/><circle cx="45" cy="11" r="7" stroke="#c7d2d1" stroke-width="4"/><circle cx="45" cy="78" r="7" stroke="#c7d2d1" stroke-width="4"/></g></svg></button>
        <button data-build="lift" data-value="high" aria-label="Hohes Fahrwerk" aria-pressed="false"><svg class="part-art" viewBox="0 0 90 90" aria-hidden="true"><g transform="translate(0 13) scale(1 0.72)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M45 14v61" stroke="#8aa5a7" stroke-width="10"/><path d="M32 22h26L32 31l26 9-26 9 26 9-26 9h26" stroke="#ff9b51" stroke-width="6"/><circle cx="45" cy="11" r="7" stroke="#c7d2d1" stroke-width="4"/><circle cx="45" cy="78" r="7" stroke="#c7d2d1" stroke-width="4"/></g></svg></button>
        <button data-build="lift" data-value="extraHigh" aria-label="Extra hohes Fahrwerk" aria-pressed="false"><svg class="part-art" viewBox="0 0 90 90" aria-hidden="true"><g transform="translate(0 0) scale(1 1)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M45 14v61" stroke="#8aa5a7" stroke-width="10"/><path d="M32 22h26L32 31l26 9-26 9 26 9-26 9h26" stroke="#ff9b51" stroke-width="6"/><circle cx="45" cy="11" r="7" stroke="#c7d2d1" stroke-width="4"/><circle cx="45" cy="78" r="7" stroke="#c7d2d1" stroke-width="4"/></g></svg></button>
      </div>
    </div>
    <div data-workshop-panel="engine" hidden><div class="part-options" role="group" aria-label="Motoren">
      <button data-build="engine" data-value="classic" data-preview="Engine_classic" aria-label="V8-Motor" aria-pressed="true"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-engine"/></svg></button>
      <button data-build="engine" data-value="supercharged" data-preview="Engine_supercharged" aria-label="Kompressor-Motor" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-engine"/></svg></button>
      <button data-build="engine" data-value="electric" data-preview="Engine_electric" aria-label="Elektromotor" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-engine"/></svg></button>
    </div></div>
    <div data-workshop-panel="parts" hidden>
      <div class="part-options addon-options"><button data-build="wing" aria-label="Großen Stunt-Spoiler anbauen" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-wing"/></svg><span class="sr-only">Spoiler</span></button><button data-build="lights" aria-label="Dachscheinwerfer anbauen" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-lights"/></svg><span class="sr-only">Lichter</span></button><button data-build="pipes" aria-label="Show-Auspuff anbauen" aria-pressed="false"><svg class="part-art" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-pipes"/></svg><span class="sr-only">Auspuff</span></button></div>
    </div>
  </section>
  <button id="start" class="primary-button" aria-label="Losfahren" disabled><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-play"/></svg><span id="startText" class="sr-only">Lädt …</span></button>
  <p id="loadStatus" role="status"></p><button id="retryLoad" hidden>Erneut laden</button>
</section>
<section id="hud" class="hud" hidden aria-label="Rennanzeige">
  <div class="race-progress"><span id="position" aria-label="Platz">1/6</span><span class="divider"></span><span aria-label="Runde" id="lapLabel">1/3</span><div id="lapDots" class="lap-dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
  <button id="pause" class="icon-button pause-button" aria-label="Pause"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-pause"/></svg></button>
  <div id="wrongWay" class="wrong-way" hidden><button id="recover" aria-label="Zurück auf die Strecke"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-restart"/></svg></button></div>
  <div id="countdown" class="countdown" role="status"></div>
  <div id="toast" class="toast" aria-hidden="true"></div>
  <div class="touch-steering"><button data-control="left" aria-label="Nach links lenken"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-left"/></svg></button><button data-control="right" aria-label="Nach rechts lenken"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-right"/></svg></button></div>
  <div class="pedals" role="group" aria-label="Gas und Bremse"><button data-control="brake" class="pedal brake" aria-label="Bremsen und rückwärts"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-brake"/></svg></button><button data-control="forward" class="pedal gas" aria-label="Gas geben"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-pedal"/></svg></button></div>
</section>
<section id="pauseOverlay" class="overlay" hidden><div class="dialog settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <h2 id="settingsTitle" class="sr-only">Einstellungen</h2>
  <div class="picture-settings"><button id="sound" aria-label="Ton" aria-pressed="true"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-sound"/></svg><i class="toggle-mark" aria-hidden="true">✓</i><b class="off-slash" aria-hidden="true"></b></button><button id="fullscreen" aria-label="Vollbild"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-screen"/></svg></button><button id="tiltToggle" aria-label="Handy-Lenkung" aria-pressed="false"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-phone"/></svg><i class="toggle-mark" aria-hidden="true">✓</i></button></div>
  <button id="resume" class="primary-button" aria-label="Weiterspielen"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-play"/></svg></button>
</div></section>
<section id="finishOverlay" class="overlay" hidden><div class="dialog finish-dialog" role="dialog" aria-modal="true" aria-labelledby="finishTitle">
  <svg class="trophy" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-trophy"/></svg><h2 id="finishTitle">Geschafft!</h2><p id="finishSubtitle"></p><div id="finishStars" class="finish-stars" aria-label="Drei Sterne">★ ★ ★</div>
  <p id="newRecord" class="new-record" hidden>Dein neuer Rekord!</p>
  <button id="again" class="primary-button" aria-label="Noch mal spielen"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-restart"/></svg></button>
</div></section>
<section id="paintBand" class="paint-band" role="group" aria-label="Farbe: Karosserie" hidden><button class="swatch" data-color="#14bdd1" style="--swatch:#14bdd1" aria-label="Türkis" aria-pressed="false"></button><button class="swatch" data-color="#fc593e" style="--swatch:#fc593e" aria-label="Rot" aria-pressed="false"></button><button class="swatch" data-color="#b9ea48" style="--swatch:#b9ea48" aria-label="Grün" aria-pressed="false"></button><button class="swatch" data-color="#ae82dc" style="--swatch:#ae82dc" aria-label="Lila" aria-pressed="false"></button><button class="swatch" data-color="#ff6c24" style="--swatch:#ff6c24" aria-label="Orange" aria-pressed="false"></button><button class="swatch" data-color="#f6eacb" style="--swatch:#f6eacb" aria-label="Creme" aria-pressed="false"></button><button class="swatch" data-color="#ffd253" style="--swatch:#ffd253" aria-label="Gelb" aria-pressed="false"></button></section>
<button id="inspectTruck" class="icon-button inspect-button" aria-label="Truck von allen Seiten ansehen" hidden><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-zoom"/></svg></button>
<section id="inspectControls" class="inspect-controls" aria-label="Fahrzeug-Nahansicht" hidden>
  <button data-orbit="left" aria-label="Ansicht nach links drehen"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-left"/></svg></button>
  <button data-orbit="right" aria-label="Ansicht nach rechts drehen"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-right"/></svg></button>
  <button data-orbit="in" aria-label="Vergrößern"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-zoom"/></svg></button>
  <button data-orbit="out" aria-label="Verkleinern"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-minus"/></svg></button>
  <button id="closeInspect" aria-label="Ganzen Truck ansehen"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-screen"/></svg></button>
</section>
</main>
<script type="module" src="./src/game.mjs"></script>
</body></html>
